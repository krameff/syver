name: Verify actions lockfile

# .github/workflows/actions.lock pins every action these workflows use,
# including the actions those actions call, to a commit. This fails a pull
# request whose workflows and lockfile disagree, so a stale lockfile is found
# here rather than by a blocked run once the "Require lockfile" policy is on.
# To fix a failure: run `gh actions-lock` locally and commit the lockfile with
# the workflow change.

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    paths:
      - ".github/workflows/**"

concurrency:
  # Pure check, nothing published. See golangci.yaml.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        # Pinned to a release so a new version cannot change this check
        # without a pull request.
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --no-interactive
