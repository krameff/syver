name: Docker image for Syver

on:
  push:
    branches:
      - main
      - devel
  workflow_dispatch:

env:
  PLATFORMS: "linux/amd64,linux/arm64"

jobs:
  syver:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write  # To upload Trivy sarif files
      # github/codeql-action reads the workflow run via the Actions API
      # (GET /repos/{owner}/{repo}/actions/runs/{run_id}). security-events
      # does not grant that, and on a private repository the read is
      # mandatory -- without it upload-sarif dies with "Resource not
      # accessible by integration" pointing at the workflow-runs endpoint.
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/syver

      - name: Build goss binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --snapshot
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Repo history contains non-semver tags (e.g. v0.5.1_alpha), which
          # goreleaser refuses to parse even in --snapshot mode. Pin a known
          # valid tag for these CI-only builds; the actual value is discarded
          # since dockers_v2 is disabled during snapshot builds.
          GORELEASER_CURRENT_TAG: "v0.0.0"

      - name: Stage docker build context
        run: |
          set -euo pipefail
          mkdir -p linux/amd64 linux/arm64
          cp dist/binaries_linux_amd64_*/syver linux/amd64/syver
          cp dist/binaries_linux_arm64_*/syver linux/arm64/syver

      - name: Build main goss image
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syver:main
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}

      - name: Build devel goss image
        if: github.ref_name == 'devel'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syver:devel
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}

      - name: Run Trivy vulnerability scanner (main)
        if: github.ref_name == 'main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/syver:main
          format: sarif
          output: trivy-main-results.sarif

      - name: Run Trivy vulnerability scanner (devel)
        if: github.ref_name == 'devel'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/syver:devel
          format: sarif
          output: trivy-devel-results.sarif

      - name: Upload Trivy scan results (main) to GitHub Security tab
        if: github.ref_name == 'main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-main-results.sarif

      - name: Upload Trivy scan results (devel) to GitHub Security tab
        if: github.ref_name == 'devel'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-devel-results.sarif
