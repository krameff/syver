name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - mkdocs.yml
      - docs/**
      - README.md
      - LICENSE
      - extras/**/README.md
      - .github/CONTRIBUTING.md
  workflow_dispatch:

concurrency:
  # Nothing here publishes: Read the Docs builds the site itself, from
  # .readthedocs.yaml. These jobs only check, so a newer run can replace an
  # older one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            docs/**/*.md
            README.md
            extras/**/README.md
            .github/CONTRIBUTING.md

  build:
    # The same build Read the Docs runs (Python 3.12, docs/requirements.txt),
    # with --strict, so a broken link, anchor or snippet fails the pull request
    # instead of the next Read the Docs build. Nothing is uploaded.
    name: Build Documentation (strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --requirement docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
