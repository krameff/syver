name: Golang ci
on:
  # don't build any branch other than main (and prs) when git pushed
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
      # A glob, not a regex. GitHub branch filters are glob-only, so the previous
      # "/^v\\d+\\.\\d+.../" matched NOTHING -- a release branch would have run
      # no CI at all. Kept rather than deleted so v0.9, v1.0.1 and v2.0-rc1 style
      # branches are covered if one is ever cut.
      - "v[0-9]*"
      - devel
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall

  coverage:
    needs: [lint]
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests and coverage
        run: make cov

      - name: Discovery E2E
        run: make test-discovery-e2e

      - name: Depends-on E2E
        run: make test-depends-on-e2e

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          # Pinning the action SHA pins the INSTALLER, not the scanner: this
          # action's `version` input defaults to 'latest'. Security scan findings
          # now fail the build, so an unpinned scanner could turn CI red with no
          # repo change. Keep in step with SYVER_TRIVY_IMAGE in ci/security-scan.sh.
          version: v0.74.0

      - name: Security scan
        env:
          SECURITY_STRICT: "1"
        run: ./ci/security-scan.sh

      # Its only other caller is .githooks/pre-commit, which needs an opt-in
      # `git config core.hooksPath .githooks`, so without this a suppression
      # could go stale and nothing would notice.
      # Deliberately NOT strict here. A stale suppression is not a
      # vulnerability, and this check depends on trivy's DB, which cannot be
      # pinned the way the scanner version is -- so strict would fail unrelated
      # PRs the day upstream ships a fix or retires an ID. The strict run lives
      # in trivy-schedule.yaml, where a red build means "go look" rather than
      # "your PR is blocked".
      - name: Validate .trivyignore entries
        run: ./ci/trivyignore-check.sh

  integration-test-linux:
    needs: [coverage]
    name: Integration tests (linux/${{ matrix.distro }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [rockylinux9, almalinux10, bullseye, jammy, alpine3, arch, test-int-serve-linux-amd64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        shell: bash
        run: make ${{ matrix.distro }}

  integration-test-linux-ppc64le:
    needs: [coverage]
    name: Integration tests (linux/ppc64le)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le
      - name: Integration tests
        shell: bash
        run: make test-int-validate-linux-ppc64le test-int-serve-linux-ppc64le

  integration-test-linux-arm64:
    needs: [coverage]
    name: Integration tests (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        shell: bash
        run: make test-int-validate-linux-arm64 test-int-serve-linux-arm64

  integration-test-other:
    needs: [coverage]
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests
        shell: bash
        run: make test

      - name: Integration tests
        shell: bash
        run: |
          os_name="$(go env GOOS)"
          arch="$(go env GOARCH)"
          make "test-int-validate-${os_name}-${arch}" "test-int-serve-${os_name}-${arch}"
