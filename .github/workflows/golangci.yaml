name: Golang ci
on:
  # don't build any branch other than main (and prs) when git pushed
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
      - devel
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Supersede an in-flight run for the same ref. Pure check, nothing published,
  # so an older run's result is worthless once a newer commit exists.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall

  # Cross-platform lint and vulnerability scan, on PUSHES ONLY.
  #
  # Both golangci-lint and govulncheck resolve per-GOOS, so everything above sees
  # the Linux build alone: no *_windows.go or *_darwin.go file had ever been linted
  # or had its call graph analysed. `vet-cross` covered vet for those platforms and
  # nothing covered the other two, which is how two dead functions lived in
  # system/file.go until 2026-09-21.
  #
  # Gated to `push` so it runs on devel and main (this workflow's only push
  # branches) and not on every pull request: it is three lint runs and three
  # reachability analyses, and the release gate in release.yaml runs it too. A
  # feature branch that breaks it therefore learns at merge, not at PR -- an
  # accepted trade for keeping the PR loop fast.
  cross-platform:
    if: github.event_name == 'push'
    name: cross-platform lint and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # The action installs for the host platform only, so lint-cross needs the
      # binary on PATH to invoke it under a different GOOS.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint (host, windows, darwin)
        run: make lint-cross

      # No Trivy here: it scans the filesystem, not a build, so it is
      # platform-independent and the coverage job already runs it. This step is
      # govulncheck across the three platforms, which is the part that is per-GOOS.
      - name: Vulnerability scan (host, windows, darwin)
        env:
          SYVER_TRIVY_SCANNERS: vuln
        run: SYVER_SCAN_GOOS="windows darwin" ./ci/security-scan.sh

  coverage:
    needs: [lint]
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests and coverage
        run: make cov

      - name: Discovery E2E
        run: make test-discovery-e2e

      - name: Depends-on E2E
        run: make test-depends-on-e2e

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          # Pinning the action SHA pins the INSTALLER, not the scanner: this
          # action's `version` input defaults to 'latest'. Security scan findings
          # now fail the build, so an unpinned scanner could turn CI red with no
          # repo change. Keep in step with SYVER_TRIVY_IMAGE in ci/security-scan.sh.
          version: v0.74.0

      - name: Security scan
        env:
          SECURITY_STRICT: "1"
        run: ./ci/security-scan.sh

      # Its only other caller is .githooks/pre-commit, which needs an opt-in
      # `git config core.hooksPath .githooks`, so without this a suppression
      # could go stale and nothing would notice.
      # Deliberately NOT strict here. A stale suppression is not a
      # vulnerability, and this check depends on trivy's DB, which cannot be
      # pinned the way the scanner version is -- so strict would fail unrelated
      # PRs the day upstream ships a fix or retires an ID. The strict run lives
      # in trivy-schedule.yaml, where a red build means "go look" rather than
      # "your PR is blocked".
      - name: Validate .trivyignore entries
        run: ./ci/trivyignore-check.sh

  integration-test-linux:
    needs: [coverage]
    name: Integration tests (linux/${{ matrix.distro }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [rockylinux9, almalinux10, jammy, alpine3, arch, test-int-serve-linux-amd64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        shell: bash
        run: make ${{ matrix.distro }}

  integration-test-linux-ppc64le:
    needs: [coverage]
    name: Integration tests (linux/ppc64le)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le
      - name: Integration tests
        shell: bash
        run: make test-int-validate-linux-ppc64le test-int-serve-linux-ppc64le

  integration-test-linux-arm64:
    needs: [coverage]
    name: Integration tests (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        shell: bash
        run: make test-int-validate-linux-arm64 test-int-serve-linux-arm64

  integration-test-other:
    needs: [coverage]
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests
        shell: bash
        run: make test

      - name: Integration tests
        shell: bash
        # The target comes from the runner, so macos-latest (arm64) runs the
        # darwin-arm64 fixtures only. integration-tests/syver/darwin-amd64 is
        # exercised locally by `make test-int-darwin-all`, never here.
        run: |
          os_name="$(go env GOOS)"
          arch="$(go env GOARCH)"
          make "test-int-validate-${os_name}-${arch}" "test-int-serve-${os_name}-${arch}"
