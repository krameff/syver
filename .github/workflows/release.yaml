---
name: "Build release artifacts"

on:
  push:
    tags:
      # v[0-9]*, not v*. A glob's `*` matches zero or more characters, so `v*`
      # fired on any tag starting with v -- vtest, vbackup, v-wip, or a bare v.
      # Each of those would have run the gate and then signed and published a
      # release from a scratch tag. This still matches every release ever cut
      # (v0.7.0 through v0.9.1, and prerelease forms like v1.0.0-rc1).
      - "v[0-9]*"
  workflow_dispatch:

concurrency:
  group: releaser
  cancel-in-progress: true

jobs:
  # Gate. The release path was previously ungated: this workflow fires on a TAG
  # push, and golangci.yaml only has `push.branches`, which per GitHub's docs does
  # not run for tag pushes at all. So nothing verified the commit a tag pointed at
  # -- in the normal flow the gate had run earlier via the PR, but that was
  # convention, not enforcement, and nothing stopped a tag being cut on a commit
  # whose scan failed or never ran. Signing keys and packages: write are handed
  # out in `build` below, so this runs first and that job `needs:` it.
  gate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # The version is pinned in ci/lib/trivy.sh, shared with the local scripts.
      # Pinning the action SHA pins the INSTALLER, not the scanner: its
      # `version` input defaults to 'latest', and scan findings fail the build.
      - name: Read the pinned Trivy version
        id: trivy
        run: echo "version=v$(. ci/lib/trivy.sh && echo "${SYVER_TRIVY_VERSION}")" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ steps.trivy.outputs.version }}

      # Lint is here because NOTHING ELSE LINTS A TAG. golangci.yaml uses
      # `push.branches`, which per GitHub's docs does not run for tag pushes at
      # all, and `make check` does not include `make lint` either -- so before
      # this step a tag could be, and was, cut on a lint-red tree. A gofmt
      # violation rode into both v0.9.2 and v0.9.3 that way.
      #
      # `go install` rather than golangci-lint-action because this runs the
      # Makefile's own `lint` target, so the release gate and a developer's
      # local `make lint` are the same command over the same package list.
      # Keep the version in step with golangci.yaml's `version:` input.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # lint-cross, not lint: it runs the host pass and then windows and darwin.
      # Both golangci-lint and govulncheck resolve per-GOOS, so a host-only gate
      # tags a release having never linted a single *_windows.go or *_darwin.go
      # file. Added 2026-09-21, for a release whose headline is Windows support.
      - name: Lint (host, windows, darwin)
        run: make lint-cross

      - name: Unit tests
        run: make test

      - name: Security scan (host, windows, darwin)
        env:
          SECURITY_STRICT: "1"
          # govulncheck's reachability analysis is per-GOOS. Scanning only the host
          # build means the Windows and macOS code paths in a release were never
          # analysed. See SYVER_SCAN_GOOS in ci/security-scan.sh.
          SYVER_SCAN_GOOS: "windows darwin"
        run: ./ci/security-scan.sh

  build:
    needs: [gate]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - run: make dgoss-sha256 dcgoss-sha256 kgoss-sha256 dsyver-sha256 dcsyver-sha256 ksyver-sha256 sbxsyver-sha256

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up QEMU (for ARM64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG signing key (Ed25519)
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # The second artifact key exists because a FIPS-mode gpg rejects
      # Ed25519. It writes its own `.rsa.sig` file rather than a second
      # signature inside `.sig`: a `.sig` holding two signatures makes
      # `gpg --verify` exit 2 for anyone who has imported only one key.
      - name: Import GPG signing key (RSA)
        id: import_gpg_rsa
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_RSA_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_RSA_PASSPHRASE }}

      # Fail fast, and fail with the reason named. Without this the mismatch
      # only surfaces as `gpg: skipped "<fpr>": No secret key` after the full
      # cross-compile has already run, and a signature made with the wrong
      # key would ship looking valid while verifying against nothing users
      # have. Each expected fingerprint is read from the checked-in public
      # key rather than hardcoded, so it stays correct through key rotation.
      - name: Verify the imported keys are the project signing keys
        env:
          IMPORTED: ${{ steps.import_gpg.outputs.fingerprint }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          IMPORTED_RSA: ${{ steps.import_gpg_rsa.outputs.fingerprint }}
          PASSPHRASE_RSA: ${{ secrets.GPG_RSA_PASSPHRASE }}
        run: |
          set -euo pipefail

          # check_key <public key file> <imported fpr> <passphrase> <secret prefix>
          check_key() {
            local file="$1" imported="$2" pass="$3" secret="$4" expected probe

            echo "== $file"
            echo "Imported key fingerprint: ${imported:-<none>}"

            if [ -z "$imported" ]; then
              echo "::error::No GPG key was imported for $file. Check that the" \
                   "${secret}_PRIVATE_KEY and ${secret}_PASSPHRASE repository" \
                   "secrets are set."
              exit 1
            fi

            expected="$(gpg --show-keys --with-colons "$file" \
                        | awk -F: '/^fpr:/ {print $10; exit}')"
            echo "Expected key fingerprint: $expected  ($file)"

            if [ "$imported" != "$expected" ]; then
              echo "::error::Signing key mismatch. The ${secret}_PRIVATE_KEY" \
                   "secret holds $imported, but this project publishes" \
                   "$expected in $file and documents it in" \
                   "docs/installation.md. Releases signed with $imported" \
                   "cannot be verified by anyone. Replace the secret with an" \
                   "export of the published key."
              exit 1
            fi

            # A key exported with --export-secret-subkeys leaves the primary
            # secret stubbed (sec#). Both published keys sign with the
            # primary, so that export cannot sign and gpg reports it as
            # "No secret key".
            if ! gpg --list-secret-keys --with-colons "$imported" \
                 | grep -q '^sec:'; then
              echo "::error::No usable primary secret key for $imported." \
                   "Re-export with 'gpg --export-secret-keys --armor' rather" \
                   "than --export-secret-subkeys."
              exit 1
            fi

            # Prove signing works before spending three minutes building.
            # Signs a file argument, exactly as the goreleaser signs blocks
            # do, so stdin stays free to carry the passphrase the same way.
            # The signature goes to a temp file, never /dev/null: gpg deletes
            # its --output file when signing fails, and as root that is
            # /dev/null itself.
            probe="$(mktemp)"
            echo probe > "$probe"
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              -u "$imported" --output "$probe.sig" --detach-sign "$probe" \
              <<< "$pass"
            echo "Signing probe succeeded."
          }

          echo "Secret keys in the keyring:"
          gpg --list-secret-keys --with-colons --with-subkey-fingerprints \
            | grep -E '^(sec|ssb|fpr)' || true

          check_key krameff-syver-key.asc "${IMPORTED:-}" "$PASSPHRASE" GPG
          check_key krameff-syver-key-rsa.asc "${IMPORTED_RSA:-}" "$PASSPHRASE_RSA" GPG_RSA

      # goreleaser's `sboms:` block shells out to syft and does not ship it.
      # This step sits BEFORE the release for the same reason the GPG probe
      # above does: without it the release builds every binary, signs the
      # checksums, and only then fails at the SBOM stage. Pinned to a release
      # commit sha, matching how every other third-party action here is pinned,
      # so an upstream change cannot turn a tag push red with no repository
      # change -- the rule the Trivy installer comment in golangci.yaml states.
      - name: Install syft (SBOM generator for goreleaser)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Verify syft is on PATH before the release runs
        run: |
          set -euo pipefail
          command -v syft
          syft --version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_RSA_FINGERPRINT: ${{ steps.import_gpg_rsa.outputs.fingerprint }}
          GPG_RSA_PASSPHRASE: ${{ secrets.GPG_RSA_PASSPHRASE }}
