name: Trivy Code Scanning

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      # contents: read is required by actions/checkout below. GitHub sets every
      # unlisted scope to none as soon as a permissions block exists, so adding
      # a checkout to a job that never had one needs this too.
      contents: read
      packages: read
      security-events: write
      # Same reason as docker-syver.yaml: codeql-action's upload-sarif
      # reads the run through the Actions API, which security-events does
      # not cover on a private repository.
      actions: read

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/syver:latest
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      # Deliberately LAST, and deliberately after the SARIF upload. Steps default
      # to `if: success()`, so a strict failure here skips everything below it --
      # and a stale .trivyignore entry must never cancel the vulnerability scan
      # or its upload. A stale suppression is not a vulnerability.
      #
      # Strict on the schedule but NOT on PRs (see golangci.yaml): this check is
      # driven by trivy's database, which cannot be pinned the way the scanner
      # version is, so it can start failing with no repo change. Weekly that is a
      # "go look" signal; on a PR it would block unrelated work.
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Validate .trivyignore entries (strict)
        env:
          TRIVYIGNORE_STRICT: "1"
        run: ./ci/trivyignore-check.sh
