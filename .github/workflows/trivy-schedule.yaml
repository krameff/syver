name: Trivy Code Scanning

on:
  schedule:
    - cron: "0 3 * * 5"
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      packages: read
      security-events: write
      # Same reason as docker-syver.yaml: codeql-action's upload-sarif
      # reads the run through the Actions API, which security-events does
      # not cover on a private repository.
      actions: read

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/syver:latest
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
