name: Validate YAML

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    paths:
      - "**/*.ya?ml"

concurrency:
  # Pure check, nothing published. See golangci.yaml.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate YAML file
        run: make lint-yaml
