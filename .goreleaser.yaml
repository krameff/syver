---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: syver

before:
  hooks:
    - go mod tidy

builds:
  - id: binaries
    binary: syver
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - s390x
    ignore:
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    main: ./cmd/syver
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/krameff/syver/util.Version={{ .Version }}"
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - binary
    id: archives
    name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

dockers_v2:
  - id: images
    ids:
      - binaries
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "Quick and Easy server testing/validation"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.url": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    disable: "{{ .IsSnapshot }}"
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/syver"
    tags:
      - "v{{ .Version }}"
      - "{{ if .IsNightly }}nightly{{ end }}"
      - "{{ if not .IsNightly }}latest{{ end }}"

checksum:
  algorithm: sha256
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"

# SPDX, one document per archive. Chosen over CycloneDX deliberately: it is
# goreleaser's own default and the format federal consumers expect, and the
# format is the part downstream automation binds to, so it is expensive to
# change later.
#
# This shells out to `syft`, which is NOT part of goreleaser. The release
# workflow installs it before this runs; without that step the release builds
# and signs everything and then dies here, which is the worst place to fail.
sboms:
  - id: binaries
    # `binary`, NOT `archive`. This project's `archives:` block uses
    # `formats: [binary]`, so it publishes raw binaries and goreleaser never
    # produces an archive artifact for the SBOM stage to match. Configured as
    # `archive` first and proved wrong on go-builder: the run logged
    # "no artifacts matching current filters" and emitted no document, while
    # still reporting success.
    artifacts: binary
    # The document name MUST mirror the published binary name. `${artifact}`
    # resolves to the built binary, which is `syver` for every target, so all
    # eight documents were called `syver.spdx.json` and goreleaser reported
    # "artifact already present in the list" -- they collide on upload and only
    # one survives. Proved on go-builder. This template matches the
    # `archives.name_template` above, so each SBOM sits beside the binary it
    # describes.
    documents:
      - >-
        {{ .ProjectName }}-
        {{- .Os }}-
        {{- .Arch }}
        {{- if .Arm }}v{{ .Arm }}{{ end }}.spdx.json

# Two signing passes over the same key, not one. `artifacts:` takes a single
# value, so covering both the checksum file and the SBOMs needs two entries.
# The SBOMs are signed on purpose: an unsigned SBOM sitting beside a signed
# checksum leaves a consumer to guess which one is authoritative.
signs:
  - id: gpg
    cmd: gpg
    signature: "${artifact}.sig"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    stdin: "{{ .Env.GPG_PASSPHRASE }}"

  - id: gpg-sbom
    cmd: gpg
    signature: "${artifact}.sig"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: sbom
    stdin: "{{ .Env.GPG_PASSPHRASE }}"

release:
  extra_files:
    # Directories are now *syver; the goss-named wrappers inside them are the
    # compatibility shims and keep their filenames.
    - glob: ./extras/*syver/*goss*
    - glob: ./extras/dsyver/dsyver*
    - glob: ./extras/dcsyver/dcsyver*
    - glob: ./extras/ksyver/ksyver*
    - glob: ./krameff-syver-key.asc

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
