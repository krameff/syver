---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: syver

before:
  hooks:
    - go mod tidy

builds:
  - id: binaries
    binary: syver
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - s390x
    ignore:
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    main: ./cmd/syver
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/krameff/syver/util.Version={{ .Version }}"
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - binary
    id: archives
    name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

dockers_v2:
  - id: images
    ids:
      - binaries
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "Quick and Easy server testing/validation"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.url": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    disable: "{{ .IsSnapshot }}"
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/syver"
    tags:
      - "v{{ .Version }}"
      - "{{ if .IsNightly }}nightly{{ end }}"
      - "{{ if not .IsNightly }}latest{{ end }}"

checksum:
  algorithm: sha256
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"

signs:
  - id: gpg
    cmd: gpg
    signature: "${artifact}.sig"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    stdin: "{{ .Env.GPG_PASSPHRASE }}"

release:
  extra_files:
    # Directories are now *syver; the goss-named wrappers inside them are the
    # compatibility shims and keep their filenames.
    - glob: ./extras/*syver/*goss*
    - glob: ./extras/dsyver/dsyver*
    - glob: ./extras/dcsyver/dcsyver*
    - glob: ./extras/ksyver/ksyver*
    - glob: ./krameff-syver-key.asc

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
