<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560" role="img" aria-label="Syver - SYstem VERification, by Krameff Solutions Ltd">
  <title>Syver</title>

  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1bb8a4"/>
      <stop offset="100%" stop-color="#12907f"/>
    </linearGradient>
  </defs>

  <!-- Dark navy background card -->
  <rect x="0" y="0" width="500" height="560" rx="32" fill="#1a1f3a"/>

  <!-- Icon: a shield (verification) enclosing a checkmark. Native vector,
       no embedded raster, so it scales cleanly and the file stays diffable. -->
  <g transform="translate(250, 192)">
    <!-- shield outline -->
    <path d="M 0,-104 L 86,-70 C 86,10 52,74 0,104 C -52,74 -86,10 -86,-70 Z"
          fill="url(#shieldGrad)"/>
    <!-- inner cut, leaves a bold rim -->
    <path d="M 0,-78 L 62,-52 C 62,8 38,56 0,78 C -38,56 -62,8 -62,-52 Z"
          fill="#1a1f3a"/>
    <!-- checkmark -->
    <path d="M -34,-2 L -10,26 L 36,-32"
          fill="none" stroke="#1bb8a4" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Syver wordmark -->
  <text
    x="250" y="390"
    font-family="'Arial', 'Liberation Sans', sans-serif"
    font-weight="bold"
    font-size="72"
    fill="#1bb8a4"
    text-anchor="middle">Syver</text>

  <!-- SYstem VERification tagline: the name's actual derivation -->
  <text
    x="250" y="430"
    font-family="'Arial', 'Liberation Sans', sans-serif"
    font-size="20"
    fill="rgba(255,255,255,0.75)"
    text-anchor="middle"
    letter-spacing="3">SYstem VERification</text>

  <!-- by Krameff Solutions Ltd sub-subheading -->
  <text
    x="250" y="476"
    font-family="'Arial', 'Liberation Sans', sans-serif"
    font-size="14"
    fill="rgba(255,255,255,0.55)"
    text-anchor="middle"
    letter-spacing="4">by KRAMEFF SOLUTIONS LTD</text>
</svg>
