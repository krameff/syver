<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bruno+Ace&amp;display=swap');
    </style>
  </defs>

  <!-- Dark navy background card -->
  <rect x="0" y="0" width="500" height="560" rx="32" fill="#1a1f3a"/>

  <!-- Icon: checkmark-G mark -->
  <image href="data:image/png;base64," x="122" y="48" width="256" height="256"/>

  <!-- Goss wordmark -->
  <text
    x="250" y="382"
    font-family="'Arial', 'Liberation Sans', sans-serif"
    font-weight="bold"
    font-size="72"
    fill="#1bb8a4"
    text-anchor="middle">Goss</text>

  <!-- GO Server Spec tagline -->
  <text
    x="250" y="424"
    font-family="'Arial', 'Liberation Sans', sans-serif"
    font-size="20"
    fill="rgba(255,255,255,0.75)"
    text-anchor="middle"
    letter-spacing="4">GO Server Spec</text>

  <!-- by Krameff Solutions Ltd sub-subheading -->
  <text
    x="250" y="472"
    font-family="'Bruno Ace', 'Eurostile', 'Arial', sans-serif"
    font-size="14"
    fill="rgba(255,255,255,0.55)"
    text-anchor="middle"
    letter-spacing="4">by KRAMEFF SOLUTIONS LTD</text>
</svg>
