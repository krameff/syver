---
package:
  curl:
    installed: true
  pacman:
    installed: true
  foobar:
    installed: false
user:
  root:
    exists: true
    uid: 0
    gid: 0
    home: "/root"
file:
  "/foo":
    exists: true
    filetype: symlink
service:
  # Masked at image build time in Dockerfile_arch.
  systemd-timedated:
    masked: true
gossfile:
  "../goss-shared.yaml": {}
