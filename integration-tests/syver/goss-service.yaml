---
service:
  webservice:
    enabled: false
    running: false
{{ if .Env.OS | regexMatch "centos[7]|rockylinux[9]|almalinux10" }}
  httpd:
{{else}}
  apache2:
{{end}}
    enabled: true
    running: true
{{ if .Env.OS | regexMatch "alpine3" }}
    runlevels: ["sysinit"]
{{end}}
{{ if .Env.OS | regexMatch "rockylinux9|almalinux10|jammy" }}
    masked: false
  # Masked at image build time in the systemd Dockerfiles.
  systemd-timedated:
    masked: true
{{end}}
  skippable:
    enabled: true
    running: true
    skip: true
