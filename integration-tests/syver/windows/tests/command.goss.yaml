---
# Every command: budget in the Windows fixtures is 30000, and that is not
# generosity for its own sake. A cold windows-latest runner pays powershell
# start-up and Defender's scan of a freshly built, unsigned exe before the
# command does any work; an 8-check file was measured at 11.5s total. Three
# entries here failed at 10000 across two separate CI runs. Do not lower these:
# nothing is under test in the budget itself, so a tight one buys only flakes.
# The addr:, dns: and http: budgets are different -- there the timeout IS the
# thing being tested, and they are deliberately left alone. See BUG-003.
command:
  hello world:
    exit-status: 0
    exec: "echo hello world"
    stdout:
    - hello world
    stderr: []
    timeout: 30000
  wrap a powershell - expect 0 on CI hosts without restrictanonymous:
    exec: powershell -noprofile -noninteractive -command (get-itemproperty -path 'HKLM:/SYSTEM/CurrentControlSet/Control/Lsa/').restrictanonymous
    exit-status: 0
    stdout:
    - "0"
    stderr: []
    timeout: 30000
  wrap a powershell with quotes - expect 0 on CI hosts without restrictanonymous:
    exec: powershell -noprofile -noninteractive -command "(get-itemproperty -path 'HKLM:/SYSTEM/CurrentControlSet/Control/Lsa/').restrictanonymous"
    exit-status: 0
    stdout:
    - "0"
    stderr: []
    timeout: 30000
  powershell with quotes:
    exec: powershell -noprofile -noninteractive /c "(echo '{"b":2, "a":1}' | ConvertFrom-json).a"
    exit-status: 0
    stdout:
    - "1"
    stderr: []
    timeout: 30000
