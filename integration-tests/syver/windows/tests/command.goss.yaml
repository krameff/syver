---
# Every command: budget in the Windows fixtures is 30000, and that is not
# generosity for its own sake. A cold windows-latest runner pays powershell
# start-up and Defender's scan of a freshly built, unsigned exe before the
# command does any work; an 8-check file was measured at 11.5s total. Three
# entries here failed at 10000 across two separate CI runs. Do not lower these:
# nothing is under test in the budget itself, so a tight one buys only flakes.
# The addr:, dns: and http: budgets are different -- there the timeout IS the
# thing being tested, and they are deliberately left alone. See BUG-003.
command:
  hello world:
    exit-status: 0
    exec: "echo hello world"
    stdout:
    - hello world
    stderr:
      have-len: 0
    timeout: 30000
  wrap a powershell - expect 0 on CI hosts without restrictanonymous:
    exec: powershell -noprofile -noninteractive -command (get-itemproperty -path 'HKLM:/SYSTEM/CurrentControlSet/Control/Lsa/').restrictanonymous
    exit-status: 0
    stdout:
    - "0"
    stderr:
      have-len: 0
    timeout: 30000
  wrap a powershell with quotes - expect 0 on CI hosts without restrictanonymous:
    exec: powershell -noprofile -noninteractive -command "(get-itemproperty -path 'HKLM:/SYSTEM/CurrentControlSet/Control/Lsa/').restrictanonymous"
    exit-status: 0
    stdout:
    - "0"
    stderr:
      have-len: 0
    timeout: 30000
  powershell with quotes:
    exec: powershell -noprofile -noninteractive /c "(echo '{"b":2, "a":1}' | ConvertFrom-json).a"
    exit-status: 0
    stdout:
    - "1"
    stderr:
      have-len: 0
    timeout: 30000

  # `stderr: have-len: 0` above, not `stderr: []`. An empty list asserts
  # NOTHING and always passes, which syver itself warns about since 0.9.0
  # ("command.stderr is an empty list, which asserts nothing and always
  # passes"). All four entries carried the no-op form until 2026-09-04.
  # have-len: 0 asserts what the empty list was meant to: no stderr output.

  # SIDs. There is no `sid` attribute on `user:`, and `uid`/`gid` can never
  # work on Windows because they parse as integers while Windows identifies
  # accounts by SID. Asserting through `command:` is how a spec pins one
  # today. See also registry.goss.yaml, which reaches SIDs without a shell.
  #
  # The machine part of an account SID differs on every host, so only the
  # well-known RID is pinned: Administrator is always -500. The BUILTIN group
  # SIDs have no machine part at all and are identical everywhere, so those
  # are asserted exactly.
  guest account SID has the well-known 501 RID:
    exec: powershell -noprofile -noninteractive -command "(Get-LocalUser -Name Guest).SID.Value"
    exit-status: 0
    stdout:
    - "/^S-1-5-21-[0-9]+-[0-9]+-[0-9]+-501$/"
    stderr:
      have-len: 0
    timeout: 30000
  builtin administrators group has the fixed well-known SID:
    exec: powershell -noprofile -noninteractive -command "(Get-LocalGroup -Name Administrators).SID.Value"
    exit-status: 0
    stdout:
    - S-1-5-32-544
    stderr:
      have-len: 0
    timeout: 30000
