---
# paths are relative to the goss file that includes the gossfile directive.
gossfile:
  addr.goss.yaml: {}
  command.goss.yaml: {}
  dns.goss.yaml: {}
  file.goss.yaml: {}
  # don't use gossfile; avoid self-referencing
  # gossfile.goss.yaml: {}
  group.goss.yaml: {}
  http.goss.yaml: {}
  interface.goss.yaml: {}
  # kernel-param.na-goss.yaml: {}
  mount.goss.yaml: {}
  # package.goss.yaml is deliberately NOT included, as of 2026-09-02.
  # It declares `# expect-exit: 1` because `package:` errors unconditionally on
  # Windows by design (FEAT-010 SW-1), and including a fixture that is meant to
  # fail would make THIS aggregate fail too. Declaring `expect-exit: 1` here
  # instead would be worse: this file would then pass only while something
  # inside it fails, quietly masking a real regression in any of the others.
  # package is exercised on its own, with its own expectation.
  port.goss.yaml: {}
  process.goss.yaml: {}
  service.goss.yaml: {}
  user.goss.yaml: {}
