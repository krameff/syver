---
# FEAT-010 Task 5 (SW-8) fixed system.DefInterface.Exists so a syscall-level
# lookup failure now propagates instead of being folded into "does not
# exist" -- see interfaceLookupRanAndFoundNothing in system/interface.go.
# NOT un-skipped by this spec: this fixture's own pre-existing uncertainty
# (below) is unrelated to that fix and unresolved -- verifying the correct
# friendly interface name for a given windows-latest runner needs a real
# Windows host, which this build has none of. Un-skipping it now risks a
# flaky assertion about interface naming, not a test of FEAT-010's change.
interface:
  'Loopback Pseudo-Interface 1':
    exists: false
    addrs:
      - '127.0.0.1'
    mtu: 1500
    skip: true

# https://docs.microsoft.com/en-us/powershell/module/nettcpip/get-netipinterface?view=win10-ps
