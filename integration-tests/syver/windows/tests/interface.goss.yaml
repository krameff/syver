---
# UN-SKIPPED 2026-09-04. This file previously asserted, on one skipped entry:
#
#   'Loopback Pseudo-Interface 1':
#     exists: false          <- says it is NOT there
#     addrs: ['127.0.0.1']   <- then asserts the addresses it does not have
#     mtu: 1500
#
# which is self-contradictory: an interface that does not exist has no addrs
# and no mtu. It was skipped rather than fixed, so the contradiction was never
# noticed. Measured on Windows Server 2025: Go sees exactly two interfaces,
# `Ethernet` and `Loopback Pseudo-Interface 1`.
#
# Only the loopback name is asserted. It is the one interface present on any
# Windows host; `Ethernet` is an artefact of this particular VM and would not
# exist on every runner.
#
# `addrs` and `mtu` are deliberately not asserted. Both are plain
# net.Interface fields that work on Windows, but the loopback MTU is not a
# stable number across Windows versions and pinning it buys nothing.
#
# The absent-interface case is the point of the second entry. FEAT-010 made
# `interface:` distinguish "the lookup ran and found nothing" (still
# `exists: false`, unchanged) from "the lookup could not run" (now an error).
# If that regresses, this goes red.
interface:
  Loopback Pseudo-Interface 1:
    exists: true
  syver-no-such-nic-ffffffff:
    exists: false
