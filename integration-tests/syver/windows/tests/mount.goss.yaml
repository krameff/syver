# expect-count: 4
# expect-skipped is deliberately absent: these fixtures skip a
# different number of assertions on a real Windows host than when
# driven from another platform. Seed it from a Windows run only.
---
# NOT touched by FEAT-010. SW-7 (mount_windows.go's honest errNotImplemented
# is unreachable -- system/mount.go's getMount fails first with the
# misleading-but-loud ErrMountpointNotFound) was deliberately deferred to
# FEAT-011: reaching errNotImplemented needs reordering getMount, which is
# cross-platform code shared by every OS and not "obviously safe" to
# restructure within this spec's scope. See system/mount_windows.go.
mount:
  'c:':
    exists: true
    filesystem: ntfs

    opts: []  #  not applicable on Windows
    source: ''  #  not applicable on Windows
    usage:
      lt: 95

    skip: true  # needs implementation
