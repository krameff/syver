# expect-count: 3
# expect-skipped: 0
---
# FEAT-018: mount: has a Windows backend, covering drive letters only.
#
# opts, vfs-opts and source are deliberately not asserted. They have no Windows
# meaning and return an error there, so asserting them would fail rather than
# pass on an empty value.
#
# expect-skipped is seeded from a run on a real Windows host, not inferred.
# Driven from another platform, `c:` does not exist and the existence failure
# turns the two dependent assertions into skips, so the number differs.
mount:
  'c:':
    exists: true
    filesystem: NTFS
    usage:
      lt: 95
