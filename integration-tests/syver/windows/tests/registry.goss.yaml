# expect-count: 20
# expect-skipped is deliberately absent: these fixtures skip a
# different number of assertions on a real Windows host than when
# driven from another platform. Seed it from a Windows run only.
---
registry:
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProductName:
    exists: true
    value:
      match-regexp: "Windows.*"
    type: REG_SZ

  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\CurrentBuild:
    exists: true
    type: REG_SZ

  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\NonExistentValue12345:
    exists: false

  # Test explicit "::" separator for value names containing backslashes.
  # HardenedPaths entries use UNC paths as value names (e.g. \\*\NETLOGON).
  HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths::\\*\NETLOGON:
    exists: true
    skip: true  # only present on domain-joined machines with GPO applied

  # SIDs, via the profile list. `user:` has no `sid` attribute and `uid`/`gid`
  # can never work on Windows (they parse as integers, Windows uses SIDs), so
  # the registry is how a spec asserts on a SID today.
  #
  # S-1-5-18 is LocalSystem, a well-known SID with the same value on every
  # Windows host, so this is portable rather than specific to one machine.
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\S-1-5-18\ProfileImagePath:
    exists: true
    type: REG_EXPAND_SZ

  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\S-1-5-99-no-such-sid\ProfileImagePath:
    exists: false

  # The key-vs-value distinction, pinned as a PAIR. The last path segment is
  # read as a VALUE name, so a KEY check needs a trailing backslash. These two
  # entries name the same thing and deliberately expect opposite answers,
  # because they are different questions.
  #
  # `ProfileList` is a key with no value of that name under CurrentVersion, so
  # without the backslash the honest answer is false. That is the trap: it does
  # not error, it answers a question the author did not intend, and a spec
  # asserting `exists: true` on a key that plainly exists reports a confident
  # false. Reported from a Windows session on 2026-09-05 as "cannot assert a
  # key that has no value name".
  #
  # If anyone ever makes the trailing backslash optional or auto-detected, the
  # second entry flips to true and this fixture goes red. That is the point:
  # guessing which the user meant would move the ambiguity down a level rather
  # than remove it.
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\:
    exists: true

  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList:
    exists: false

  # FEAT-012 W2-3. The spellings regedit's address bar and Get-ItemProperty
  # actually show. Before this, a path copied from either had to be hand-edited
  # into the short form before syver would take it.
  HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProductName:
    exists: true
    value:
      match-regexp: "Windows.*"

  HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProductName:
    exists: true

  # FEAT-012 W2-4. `view: native` must mean exactly what no view at all means,
  # so this entry and the first one in this file are the same assertion written
  # two ways. If they ever disagree, adding the attribute changed the default.
  productname-explicit-native:
    name: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProductName
    exists: true
    view: native

  productname-64bit-view:
    name: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProductName
    exists: true
    view: "64"

  # `view: "32"` must RESOLVE, not merely be accepted. ProductName is present
  # in both views (measured on Windows Server 2025, 2026-09-09:
  # `reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion" /v ProductName
  # /reg:32` and `/reg:64` both succeed), so this asserts the redirected lookup
  # works rather than asserting a difference.
  productname-32bit-view:
    name: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProductName
    exists: true
    view: "32"

  # The pair where the two views genuinely DISAGREE, which is the whole point of
  # the attribute. Skipped for the same reason the HardenedPaths entry above is:
  # it depends on the image, not on syver.
  #
  # MEASURED on Windows Server 2025, 2026-09-09, rather than reasoned:
  #   reg query "HKLM\SOFTWARE\Microsoft\Windows Defender" /reg:64  -> exists
  #   reg query "HKLM\SOFTWARE\Microsoft\Windows Defender" /reg:32  -> absent
  # Defender writes only to the 64-bit branch. It can be absent or removed on a
  # hardened or minimal image, so a CI runner is not guaranteed to match and
  # these must not gate the suite.
  #
  # An earlier version of this pair used HKLM\SOFTWARE\Wow6432Node and asserted
  # it was absent from the 32-bit view, reasoning that the view would redirect
  # into a nested Wow6432Node. That was WRONG -- measured the same day, it exists
  # under BOTH views -- and it would have failed CI. Do not restore it.
  defender-64bit-view:
    name: HKLM\SOFTWARE\Microsoft\Windows Defender\
    exists: true
    view: "64"
    skip: true

  defender-32bit-view:
    name: HKLM\SOFTWARE\Microsoft\Windows Defender\
    exists: false
    view: "32"
    skip: true
