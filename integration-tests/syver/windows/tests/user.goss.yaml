# expect-count: 3
# expect-skipped is deliberately absent: these fixtures skip a
# different number of assertions on a real Windows host than when
# driven from another platform. Seed it from a Windows run only.
---
# Windows user fixture. Rewritten 2026-09-02: this file previously asserted
# uid: 65534, groups: [nfsnobody], home: /var/lib/nfs and shell: /sbin/nologin
# against Administrator. Those are Linux values that were never edited after
# the file was copied, so `skip: true` was hiding a fixture that described an
# NFS account on a Linux box rather than a gap in syver.
#
# ONLY ACCOUNTS VERIFIED ON BOTH HOSTS. That is not the same as "built-in", and
# the difference cost a CI run: `Administrator` is a built-in account and is
# present on Server 2025, but GitHub's windows-latest runner does not have it
# (`Get-LocalUser : User Administrator was not found`). `vagrant` exists on the
# local VM only. `Guest` is present on both and is what remains.
#
# The lesson generalises: verify a Windows fixture on windows-latest as well as
# on the local guest before assuming an account is universal.
#
# DELIBERATELY NOT ASSERTED, and why:
#   uid / gid  -- Windows identifies accounts by SID (S-1-5-21-...), and
#                 system/user.go does strconv.Atoi on the value, which can
#                 never succeed. This is a category mismatch, not a missing
#                 feature: there is no integer uid to report.
#   home/shell -- no meaningful Windows equivalent. `shell` is permanently
#                 unsupported: a Windows account has no login shell.
#
# groups is local group membership plus the primary group, read the same way
# for every account. The running account, which before 0.16.0 failed on its
# token's integrity label, is covered by TestGroupsCurrentUser in
# system/user_group_windows_test.go, since no account name is the running one
# on both hosts. `Guests` is a localised name, so this is English-Windows-only;
# both the go-builder guest and the CI runner are English. contain-element
# rather than an exact list: the primary group (`None`) is reported too, and a
# host may add memberships.
#
# The absent-account cases are the point of this file. They are the
# integration-level guard for the regression FEAT-010 shipped and the Windows
# container run caught: os/user returns UnknownUserError on Unix, but Windows
# returns raw ERROR_NONE_MAPPED, so a genuinely absent account was classified
# as "the lookup could not run" and `exists: false` FAILED. If that regresses,
# this fixture goes red.
user:
  Guest:
    exists: true
    groups:
      contain-element: Guests
  syver-no-such-user-ffffffff:
    exists: false
